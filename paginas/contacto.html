<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactanos - Tienda online">
    <title>Contacto - Tienda online</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1><i class="fa-solid fa-bag-shopping"></i> Tienda online</h1>
            <p>Contactanos</p>
        </div>
    </header>

    <nav>
        <ul class="nav-lista">
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="carrito.html">Carrito</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
        <div class="carrito-icono">
            <a href="carrito.html">
                <i class="fas fa-shopping-cart"></i>
                <span id="contador-carrito">0</span>
            </a>
        </div>
    </nav>

    <main>
        <section id="contacto" class="estilo-contacto">
            <h2>Contactanos</h2>
            <form id="form-contacto">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="asunto">Asunto:</label>
                <select id="asunto" name="asunto" required>
                    <option value="">Seleccioná una opción</option>
                    <option value="consulta">Consulta general</option>
                    <option value="soporte">Soporte</option>
                    <option value="venta">Consulta sobre compras</option>
                </select>
                
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                
                <button type="submit"><i class="fas fa-paper-plane"></i> Enviar</button>
            </form>
            <div id="mensaje-formulario"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tienda online - Todos los derechos reservados</p>
        <p>Sitio realizado por Rivas Franklim para Talento Tech</p>
    </footer>

    <script src="../js/script.js" type="module"></script>
</body>
</html>
