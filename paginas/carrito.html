<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tu carrito de compras - Tienda online">
    <title>Carrito - Tienda online</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1><i class="fa-solid fa-bag-shopping"></i> Tienda online</h1>
            <p>Tu carrito de compras</p>
        </div>
    </header>

    <nav>
        <ul class="nav-lista">
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="carrito.html">Carrito</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
        <div class="carrito-icono">
            <a href="carrito.html">
                <i class="fas fa-shopping-cart"></i>
                <span id="contador-carrito">0</span>
            </a>
        </div>
    </nav>

    <main>
        <section id="carrito-seccion">
            <h2><i class="fas fa-shopping-cart"></i> Tu Carrito</h2>
            <div id="carrito-contenido">
                <ul id="lista-carrito"></ul>
                <div id="total-carrito">
                    <h3>Total: $<span id="total-precio">0</span></h3>
                </div>
                <div class="carrito-botones">
                    <button id="vaciar-carrito"><i class="fas fa-trash"></i> Vaciar Carrito</button>
                    <button id="finalizar-compra"><i class="fas fa-check"></i> Finalizar Compra</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tienda online - Todos los derechos reservados</p>
        <p>Sitio realizado por Rivas Franklim para Talento Tech</p>
    </footer>
    <script src="../js/script.js" type="module"></script>
</body>
</html>
